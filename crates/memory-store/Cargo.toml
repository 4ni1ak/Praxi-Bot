[package]
name = "memory-store"
description = "Persistent agent memory: message history, embeddings, and cross-session context."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Real local embedder (fastembed-rs / ONNX Runtime). Off by default: ort downloads
# native binaries at build time and the model files are fetched on first use.
fastembed = ["dep:fastembed", "fastembed/hf-hub-native-tls", "fastembed/ort-download-binaries-native-tls"]
# Explicit local artifacts only; no model or runtime download features.
local-embeddings = ["dep:fastembed", "fastembed/ort-load-dynamic", "dep:ort", "dep:tokenizers"]

[dependencies]
regex = "1"
async-trait.workspace = true
protocol.workspace = true
provider-catalog = { path = "../provider-catalog", version = "0.1.0" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sqlite-vec = "0.1.9"
storage.workspace = true
thiserror.workspace = true
uuid.workspace = true
unicode-normalization = "0.1"
tokio.workspace = true
tokio-util.workspace = true
tempfile.workspace = true
fastembed = { version = "5", optional = true, default-features = false }
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "load-dynamic"] }
tokenizers = { version = "0.22.2", optional = true, default-features = false, features = ["onig"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
tempfile.workspace = true
tiktoken-rs = "0.12"
tokio.workspace = true
