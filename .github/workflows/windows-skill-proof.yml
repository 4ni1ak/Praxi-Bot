name: Windows skill ancestor proof

on:
  pull_request:

permissions:
  contents: read

jobs:
  ancestor-proof:
    name: Windows ancestor handle retention
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify ancestor retention and restoration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $sourcePath = 'crates/skills/src/owner.rs'
          $testName = 'owner::windows_tests::windows_snapshot_ancestor_handles_prevent_directory_replacement_until_drop'
          $originalBytes = [IO.File]::ReadAllBytes($sourcePath)
          $originalText = [Text.Encoding]::UTF8.GetString($originalBytes)
          $originalHash = (Get-FileHash $sourcePath -Algorithm SHA256).Hash
          $guard = '        .collect()'
          $replacement = '        .collect::<Result<Vec<_>>>().map(|_| Vec::new())'
          if ([regex]::Matches($originalText, [regex]::Escape($guard)).Count -ne 1) {
            throw 'Expected exactly one ancestor handle collection'
          }
          & cargo test --locked -p skills --lib
          if ($LASTEXITCODE -ne 0) { throw 'Normal Windows skills baseline failed' }
          try {
            [IO.File]::WriteAllText($sourcePath, $originalText.Replace($guard, $replacement), [Text.UTF8Encoding]::new($false))
            $result = & cargo test --locked -p skills --lib $testName -- --exact --nocapture 2>&1
            $probeExit = $LASTEXITCODE
            $result | Write-Output
            $report = $result | Out-String
            if ($probeExit -ne 101 -or
                $report -notmatch ([regex]::Escape($testName) + '.*FAILED') -or
                $report -notmatch 'test result: FAILED' -or
                $report -notmatch 'panicked at' -or
                $report -match 'could not compile|error\[E\d+\]') {
              throw 'Dropping ancestor handles did not fail the named regression'
            }
            Write-Output 'Verified failed regression for removed guard: retained ancestor handles'
          } finally {
            [IO.File]::WriteAllBytes($sourcePath, $originalBytes)
          }
          if ((Get-FileHash $sourcePath -Algorithm SHA256).Hash -ne $originalHash) {
            throw 'Ancestor source bytes were not restored exactly'
          }
          & cargo test --locked -p skills --lib
          if ($LASTEXITCODE -ne 0) { throw 'Restored Windows skills suite failed' }
          & cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Restored formatting failed' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'A source delta remains after the proof' }
          Write-Output 'Verified ancestor retention proof, restored full skills suite, and exact source bytes'
